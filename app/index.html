<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Parallax</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #040713; color: #dcecff; }
      canvas { display: block; width: 100%; height: 100%; }
      .status-panel {
        position: fixed;
        top: 1rem;
        left: 1rem;
        padding: 0.75rem 1rem;
        border: 1px solid rgb(110 180 255 / 35%);
        border-radius: 0.5rem;
        background: rgb(3 8 20 / 78%);
        backdrop-filter: blur(0.5rem);
      }
      h1 { margin: 0 0 0.25rem; font-size: 1rem; letter-spacing: 0.15em; text-transform: uppercase; }
      p { margin: 0; color: #9bcaff; font: 0.75rem ui-monospace, monospace; }
      p[data-state="failed"] { color: #ff8e8e; }
      .app-owned-llm { top: auto; bottom: 1rem; max-width: min(42rem, calc(100% - 2rem)); }
      .app-owned-llm button { margin-top: 0.5rem; }
      .benchmark-panel {
        top: auto;
        right: 1rem;
        bottom: 1rem;
        left: auto;
        width: min(32rem, calc(100% - 2rem));
        max-height: calc(50% - 1.5rem);
        overflow: auto;
      }
      .benchmark-panel h2 { margin: 0 0 0.4rem; font-size: 1rem; }
      .benchmark-panel .benchmark-summary { margin-bottom: 0.75rem; line-height: 1.45; }
      .benchmark-panel label { display: block; margin-bottom: 0.25rem; font-size: 0.75rem; }
      .benchmark-panel select,
      .benchmark-panel button {
        min-height: 2rem;
        border: 1px solid rgb(110 180 255 / 55%);
        border-radius: 0.3rem;
        background: #0b1730;
        color: inherit;
      }
      .benchmark-panel select { width: 100%; padding: 0.25rem 0.5rem; }
      .benchmark-panel button { padding: 0.25rem 0.65rem; }
      .benchmark-panel button:disabled { opacity: 0.5; }
      .benchmark-panel progress { width: 100%; margin: 0.6rem 0 0.25rem; }
      .benchmark-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }
      .benchmark-result { margin-top: 0.75rem; }
      .benchmark-result pre {
        max-height: 14rem;
        overflow: auto;
        white-space: pre-wrap;
        color: #c8e0ff;
        font: 0.7rem/1.4 ui-monospace, monospace;
      }
      .streaming-dashboard {
        right: 1rem;
        left: auto;
        width: min(32rem, calc(100% - 2rem));
        max-height: calc(50% - 1.5rem);
        overflow: auto;
      }
      .streaming-dashboard h2 { margin: 0 0 0.25rem; font-size: 1rem; }
      .streaming-dashboard h3 {
        margin: 0 0 0.3rem;
        color: #c8e0ff;
        font-size: 0.75rem;
      }
      .streaming-dashboard-summary { margin-bottom: 0.75rem; }
      .streaming-dashboard-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem 1rem;
      }
      .streaming-dashboard dl {
        display: grid;
        grid-template-columns: minmax(7.5rem, 0.85fr) minmax(0, 1.15fr);
        gap: 0.2rem 0.55rem;
        margin: 0;
        font: 0.68rem/1.35 ui-monospace, monospace;
      }
      .streaming-dashboard dt { color: #8db6e8; }
      .streaming-dashboard dd { min-width: 0; margin: 0; overflow-wrap: anywhere; color: #dcecff; }
      .streaming-dashboard dd[data-state="healthy"] { color: #9ff0bf; }
      .streaming-dashboard dd[data-state="warning"] { color: #ffd28a; }
      .streaming-dashboard dd[data-state="error"] { color: #ff8e8e; }
      .streaming-dashboard dd[data-state="unavailable"] { color: #95a2b4; }
      .streaming-dashboard-details {
        margin-top: 0.75rem;
        color: #9bcaff;
        font: 0.7rem/1.4 ui-monospace, monospace;
      }
      .streaming-dashboard-details h3 { margin-top: 0.65rem; }
      .streaming-dashboard-details ul { margin: 0; padding-left: 1.25rem; color: #c8e0ff; }
      @media (max-width: 42rem) {
        .streaming-dashboard-grid { grid-template-columns: 1fr; }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@parallax/engine": "/immutable/__ENGINE_ARTIFACT__",
          "@parallax/game": "/immutable/__GAME_ARTIFACT__"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <canvas id="render-canvas" aria-label="Parallax WebGPU render output"></canvas>
      <section class="status-panel" aria-live="polite">
        <h1>Parallax</h1>
        <p id="status">Booting local build…</p>
      </section>
      <section id="app-owned-llm-spike" class="status-panel app-owned-llm" hidden>
        <h1>App-owned Gemma 4 spike</h1>
        <p id="app-owned-llm-status">idle</p>
        <button id="app-owned-llm-start" type="button">Install / run probe</button>
      </section>
      <section id="streaming-dashboard" class="status-panel streaming-dashboard"></section>
      <section id="benchmark-mode" class="status-panel benchmark-panel"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
