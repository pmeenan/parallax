<text x="1030" y="180" class="heading">What changes</text>
<text x="1030" y="219" class="side">1. A town that supports the port.</text>
<text x="1030" y="247" class="small">Several neighborhoods and market</text><text x="1030" y="269" class="small">streets join a broad waterfront.</text>
<text x="1030" y="313" class="side">2. Multiple ways through town.</text>
<text x="1030" y="341" class="small">Full outer-moat circuit, cross-streets,</text><text x="1030" y="363" class="small">side lanes and three port routes.</text>
<text x="1030" y="411" class="heading">What stays anchored</text>
<text x="1030" y="449" class="side">Central castle + complete moat</text><text x="1030" y="480" class="side">Village square + well entrance</text><text x="1030" y="511" class="side">Forest edge + ruin entrance</text><text x="1030" y="542" class="side">Southern shore / northern forest</text>
<text x="1030" y="599" class="heading">Camera rules</text>
<text x="1030" y="637" class="side">C1 · Fields → castle → coast</text><text x="1030" y="665" class="small">Elevated variant shows town continuity.</text>
<text x="1030" y="705" class="side">C2 · Bridge → gate</text><text x="1030" y="733" class="small">Coastal town is behind the camera.</text>
<text x="1030" y="773" class="side">C3 · Port → inland castle</text><text x="1030" y="801" class="small">Sea is behind the camera.</text>
<text x="1030" y="841" class="side">C4 · Gate → fields → forest</text><text x="1030" y="869" class="small">Castle is behind the camera.</text>
<text x="1030" y="896" class="small">C5 · Forest edge → north into woods</text>
