# Project Parallax production static-serving contract (D-121).
# Install as /etc/nginx/sites-available/parallax-web.com and retain the existing
# sites-enabled symlink. This file is an http-context include: `map` is intentionally
# outside the server blocks.

map "$status:$http_range:$uri" $parallax_cache_control {
    default "no-cache";
    "~^(?:200|304)::/immutable/[a-z0-9-]+-[a-f0-9]{64}\.[a-z0-9]+$" "public, max-age=31536000, immutable";
}

map "$request_method:$uri" $parallax_allow {
    default "GET, HEAD";
    "POST:/uninstall" "";
    ~^(?:GET|HEAD): "";
    ~^[^:]+:/uninstall$ "POST";
}

map "$request_method:$uri" $parallax_method_allowed {
    default 0;
    "GET:/" 1;
    "HEAD:/" 1;
    "POST:/uninstall" 1;
    ~^(?:GET|HEAD): 1;
}

map "$request_method:$http_sec_fetch_site:$http_sec_fetch_mode:$http_sec_fetch_user:$http_sec_fetch_dest:$is_args" $parallax_clear_site_data {
    default "";
    "POST:same-origin:navigate:?1:document:" '"storage", "cache"';
}

server {
    listen 443 ssl;
    server_name parallax-web.com;

    # This is a Parallax-exclusive publication root: the exact-inventory deployer
    # deletes non-lock children and permits no unrelated or ACME challenge files.
    root /var/www/parallax-web.com;
    index index.html;
    etag on;
    # D-138 pins the representations consumed by build, installer, and offline-shell
    # validation instead of inheriting a host-distribution mime.types mapping.
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json map;
        image/ktx2 ktx2;
        application/octet-stream meshopt;
        application/wasm wasm;
    }
    default_type application/octet-stream;

    add_header Cache-Control $parallax_cache_control always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Allow $parallax_allow always;

    if ($parallax_method_allowed = 0) {
        return 405;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /service-worker.js {
        try_files /service-worker.js =404;
    }

    # Fixed D-024 endpoint. This route has no path or query-controlled deletion target;
    # Clear-Site-Data always applies to this response's own origin.
    location = /uninstall {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Clear-Site-Data $parallax_clear_site_data always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Allow "POST" always;
        if ($request_method != POST) {
            return 405;
        }
        if ($is_args != "") {
            return 403;
        }
        if ($parallax_clear_site_data = "") {
            return 403;
        }
        return 200 '<!doctype html><meta charset=utf-8><title>Parallax uninstalled</title><h1>Parallax site-data removal requested</h1><p>Chrome was asked to clear this origin storage and cache. Close this tab before reinstalling.</p>';
    }

    location / {
        try_files $uri =404;
    }

    ssl_certificate /etc/letsencrypt/live/parallax-web.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parallax-web.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 443 ssl;
    server_name www.parallax-web.com;

    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    return 308 https://parallax-web.com$request_uri;

    ssl_certificate /etc/letsencrypt/live/parallax-web.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parallax-web.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name parallax-web.com www.parallax-web.com;
    # No /.well-known/acme-challenge webroot exception: certificate renewal must not
    # place files inside the Parallax-exclusive deployment root.
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 308 https://parallax-web.com$request_uri;
}
