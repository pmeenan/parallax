# Managed by deploy/lfs/install.sh. All namespaces have PUBLIC READ access.
server {
    listen 80;
    server_name git-lfs.meenan.dev;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/git-lfs-acme;
    }
    location / { return 308 https://git-lfs.meenan.dev$request_uri; }
}

server {
    listen 443 ssl;
    server_name git-lfs.meenan.dev;
    ssl_certificate /etc/letsencrypt/live/git-lfs.meenan.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/git-lfs.meenan.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_body_timeout 3600s;
    send_timeout 3600s;
    gzip off;
    if ($request_method !~ ^(GET|HEAD|POST|PUT)$) { return 405; }

    # Never trust caller-supplied authority/protocol headers for returned LFS URLs.
    proxy_set_header Host git-lfs.meenan.dev;
    proxy_set_header X-Forwarded-Host git-lfs.meenan.dev;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    # Rudolfs only implements GET; nginx suppresses the body for client HEAD.
    proxy_method $git_lfs_upstream_method;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;

    # Restrict namespaces and paths before Rudolfs interprets them as disk paths.
    # Batch and verify perform reads only in the pinned local-storage backend.
    location ~ "^/api/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/objects/(batch|verify)$" {
        if ($request_method != POST) { return 405; }
        client_max_body_size 1m;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:18781;
    }

    location ~ "^/api/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/object/[0-9a-f]{64}$" {
        if ($request_method !~ ^(GET|HEAD|PUT)$) { return 405; }
        # No inherited 500 MB limit: data is streamed, without nginx temp copies.
        client_max_body_size 0;
        limit_except GET {
            auth_basic $git_lfs_write_auth;
            auth_basic_user_file /etc/nginx/git-lfs.htpasswd;
        }
        # Only successful read responses should be cacheable; PUT has no cache TTL.
        expires $git_lfs_expiry;
        proxy_pass http://127.0.0.1:18781;
    }
    location / { return 404; }
}

# expires only affects successful/cacheable response codes, not missing objects.
map $request_method $git_lfs_expiry {
    default off;
    GET 365d;
    HEAD 365d;
}

map $request_method $git_lfs_upstream_method {
    default $request_method;
    HEAD GET;
}

# Original socket peer, before any global real-IP rewriting. Never trust an
# X-Forwarded-For/CF-Connecting-IP claim when granting password-free writes.
geo $realip_remote_addr $git_lfs_write_auth {
    default "LFS writers";
    192.168.0.0/16 off;
}
